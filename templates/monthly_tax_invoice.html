<!doctype html>
<html>
<head>
<meta charset="UTF-8" />

<style>

body {
    font-family: Arial, sans-serif;
    padding: 40px;
}

.title {
    font-size: 24px;
    font-weight: bold;

    margin-bottom: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #ddd;
    padding: 12px;
    font-size: 12px;
}

th {
    background: #f7f7f7;
}

.summary-box {

    margin-top: 30px;

    padding: 20px;

    border: 1px solid #ddd;
}

</style>

</head>

<body>

<div class="title">
    MONTHLY TAX INVOICE
</div>

<table>

<thead>

<tr>
    <th>Date</th>
    <th>Shift ID</th>
    <th>Doctor</th>
    <th>Shift Fee</th>
    <th>HPF</th>
    <th>GST</th>
</tr>

</thead>

<tbody>

{{#each shifts}}

<tr>

    <td>{{date}}</td>
    <td>{{shiftId}}</td>
    <td>{{doctor}}</td>
    <td>{{shiftFee}}</td>
    <td>{{hpf}}</td>
    <td>{{gst}}</td>

</tr>

{{/each}}

</tbody>

</table>

<div class="summary-box">

    <div>Taxable Value: ₹ {{taxableValue}}</div>
    <br />

    <div>CGST: ₹ {{cgst}}</div>
    <br />

    <div>SGST: ₹ {{sgst}}</div>
    <br />

    <div>
        <strong>
            Grand Total: ₹ {{grandTotal}}
        </strong>
    </div>

</div>

</body>
</html>
